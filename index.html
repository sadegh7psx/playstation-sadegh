
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b18">
<title>پلی‌استیشن صادق</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
padding:25px 15px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:radial-gradient(ellipse at top,#123b70,#050b18 75%);
color:white;
font-family:tahoma;
}

.card{
width:100%;
max-width:460px;
padding:30px 23px;
text-align:center;
border:1px solid #258cff;
border-radius:26px;
background:#101f36;
box-shadow:0 20px 60px #0009;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
padding:8px;
}

h1{
font-size:25px;
margin:8px 0;
}

.sub{
font-size:11px;
letter-spacing:2px;
color:#6ebdff;
}

.line{
height:1px;
background:linear-gradient(90deg,transparent,#267ac0,transparent);
margin:25px 0;
}

h2{
font-size:17px;
color:#dceeff;
}

p{
font-size:13px;
color:#a9c5e2;
line-height:2;
}

button{
width:100%;
padding:16px;
border:1px solid #62caff;
border-radius:14px;
color:white;
font-family:inherit;
font-size:16px;
font-weight:bold;
background:linear-gradient(100deg,#075bb8,#078bdc,#3158d8);
cursor:pointer;
}

#status{
margin-top:18px;
padding:14px;
border:1px solid #24466b;
border-radius:12px;
background:#071426;
color:#b9d9f6;
font-size:12px;
line-height:2;
}

.thanks{
margin-top:20px;
text-align:center;
color:#8da9c8;
font-size:11px;
line-height:2;
}

.thanks span{
color:#59baff;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">PS</div>

<h1>پلی‌استیشن صادق</h1>
<div class="sub">PLAYSTATION SADEGH</div>

<div class="line"></div>

<h2>میزبان کنسول PS4</h2>
<p>برای شروع، دکمه زیر را انتخاب کنید.</p>

<button onclick="startHost()">
⚡ شروع کپی‌خور
</button>

<div id="status">وضعیت: آماده</div>

</div>

<div class="thanks">
با تشکر از <span>عرفان، مهندس امید</span><br>
و مجموعه <span>پلی‌باکس صالح</span>
</div>

<script>
function startHost(){
document.getElementById("status").textContent =
"فایل‌های میزبان هنوز متصل نشده‌اند.";
}
</script>

</body>
</html>
