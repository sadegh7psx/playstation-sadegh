
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<title>پلی‌استیشن صادق</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top, #153c60, transparent 55%),
    #081321;
  color: #fff;
  font-family: Tahoma, Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 430px;
  padding: 25px 20px;
  background: #142338;
  border: 1px solid #29435e;
  border-radius: 22px;
  box-shadow: 0 15px 45px #0006;
  text-align: center;
}

.logo {
  width: 105px;
  height: 105px;
  object-fit: contain;
  border-radius: 18px;
  margin-bottom: 12px;
}

h1 {
  margin: 5px 0;
  font-size: 24px;
  color: #55c3ff;
}

.subtitle {
  color: #9db4ca;
  font-size: 12px;
  margin-top: 9px;
}

.line {
  height: 1px;
  background: #ffffff18;
  margin: 23px 0;
}

h2 {
  font-size: 17px;
  margin-bottom: 12px;
}

.description {
  color: #aebfd0;
  font-size: 13px;
  line-height: 2;
}

select {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border-radius: 10px;
  border: 1px solid #405d79;
  background: #0b192a;
  color: white;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(90deg, #0879ce, #20b5f1);
  color: white;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.status {
  margin-top: 18px;
  padding: 14px 10px;
  background: #0b192a;
  border: 1px solid #263d56;
  border-radius: 10px;
  color: #b9d7ef;
  font-size: 12px;
  line-height: 2;
}

.version {
  display: inline-block;
  margin-top: 15px;
  padding: 7px 13px;
  border-radius: 20px;
  background: #123b57;
  color: #65caff;
  font-size: 11px;
}

footer {
  margin-top: 25px;
  padding-top: 16px;
  border-top: 1px solid #ffffff18;
  color: #879db3;
  font-size: 10px;
  line-height: 2.2;
}
</style>
</head>

<body>

<div class="container">

  <img
    src="logo.png"
    class="logo"
    alt="لوگوی پلی‌استیشن صادق"
    onerror="this.style.display='none'"
  >

  <h1>پلی‌استیشن صادق</h1>

  <div class="subtitle">
    سیستم اختصاصی کنسول PS4
  </div>

  <div class="version">
    نسخه میزبان 5.05 تا 14.00
  </div>

  <div class="line"></div>

  <h2>انتخاب فریمور کنسول</h2>

  <p class="description">
    نسخه موردنظر کنسول خود را انتخاب کنید.
  </p>

  <select id="firmware">
    <option value="5.05-14.00">
      فریمور 5.05 تا 14.00
    </option>
  </select>

  <button onclick="startHost()">
    شروع
  </button>

  <div class="status" id="status">
    وضعیت سیستم: آماده
  </div>

  <footer>
    با تشکر از عرفان، مهندس امید<br>
    و مجموعه پلی‌باکس صالح<br>
    PlayStation Sadegh
  </footer>

</div>

<script>
function startHost() {
  const status = document.getElementById("status");
  const firmware = document.getElementById("firmware").value;

  status.textContent =
    "نسخه انتخاب شد: " + firmware +
    " | فایل‌های میزبان هنوز متصل نشده‌اند.";
}
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("حالت آفلاین فعال شد"))
      .catch(error => console.error("خطا:", error));
  });
}
</script>
</body>
</html>
