
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پلی‌استیشن صادق</title>
<style>
body{margin:0;background:#101522;color:white;font-family:tahoma;text-align:center;padding:35px 15px}
.box{max-width:420px;margin:40px auto;background:#1c2638;padding:25px;border-radius:18px}
h1{color:#39b7ff}
select,button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:9px;font-size:16px}
button{background:#168de0;color:white;font-weight:bold}
#status{margin-top:22px;color:#b9d9ef}
</style>
</head>
<body>
<div class="box">
<h1>پلی‌استیشن صادق</h1>
<p>میزبان کنسول PS4</p>
<select id="firmware">
<option value="5.05-14.00">فریمور 5.05 تا 14.00</option>
</select>
<button onclick="startHost()">شروع</button>
<div id="status">آماده</div>
</div>
<script>
function startHost(){
document.getElementById("status").textContent =
"نسخه انتخاب شد؛ فایل‌های مجاز هنوز به سایت متصل نشده‌اند.";
}
</script>
</body>
</html>
